version: 1
applications:
  - appRoot: siithub-client
    env:
      variables:
        BACKEND_HOST: ec2-51-20-117-250.eu-north-1.compute.amazonaws.com
        BACKEND_PORT: 3001
        BACKEND_PROTOCOL: http
        SSH_PORT: 3022
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
