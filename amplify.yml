version: 1
applications:
  - appRoot: siithub-client
    env:
      variables:
        BACKEND_URL: http://ec2-51-20-117-250.eu-north-1.compute.amazonaws.com:3001
        NEXT_PUBLIC_SSH_URL: ec2-51-20-117-250.eu-north-1.compute.amazonaws.com:3022/home
