name: test when changes are applied to develop

on:
  push:
    branches: [develop]

  pull_request:
    branches: [develop]

jobs:
  test-backend:
    uses: ./.github/workflows/test-backend-app.yml

  test-git-server:
    uses: ./.github/workflows/test-project-in-docker.yml
    with:
      context: siithub-git-server

  publish-client:
    runs-on: ubuntu-latest

    needs: [test-backend, test-git-server]

    steps:
      - uses: actions/checkout@v3

      - uses: albertmakan/siithub/.github/actions/build-and-push@develop
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          context: siithub-client
          tags: panicmilos/siithub-client:latest, panicmilos/siithub-client:${{ github.run_number }}

  publish-backend:
    runs-on: ubuntu-latest

    needs: [test-backend, test-git-server]

    steps:
      - uses: actions/checkout@v3

      - uses: albertmakan/siithub/.github/actions/build-and-push@develop
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          context: siithub-backend
          tags: panicmilos/siithub-backend:latest, panicmilos/siithub-backend:${{ github.run_number }}

  publish-git-server:
    runs-on: ubuntu-latest

    needs: [test-backend, test-git-server]

    steps:
      - uses: actions/checkout@v3

      - uses: albertmakan/siithub/.github/actions/build-and-push@develop
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
          context: siithub-git-server
          tags: panicmilos/siithub-git-server:latest, panicmilos/siithub-git-server:${{ github.run_number }}
